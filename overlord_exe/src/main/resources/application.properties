#overlord.mqtt_broker_uri=wss://tartarus-mqtt.subjugated.club:4447/mqtt
# No trailing slash on base_url
overlord.base_url=http://localhost:8090

overlord.bsky.user=overlord-exe-dev-1.bsky.social
overlord.bsky.password_file=/tmp/password

# Dev only thymeleaf stuff
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.thymeleaf.suffix=.html

# Amazon Bedrock & Nova Lite configuration
overlord.bedrock.region=us-east-2
overlord.bedrock.model-id=arn:aws:bedrock:us-east-2:980793555666:inference-profile/us.amazon.nova-lite-v1:0
overlord.bedrock.max-tokens=300
overlord.bedrock.temperature=0.3

# Bedrock cost control limits
overlord.bedrock.limits.max-message-length=500
overlord.bedrock.limits.max-context-messages=10
overlord.bedrock.limits.max-conversation-turns=8
overlord.bedrock.limits.convo-rate-limit-count=5
overlord.bedrock.limits.convo-rate-limit-window-seconds=30
overlord.bedrock.limits.convo-min-interval-seconds=2
overlord.bedrock.limits.global-rate-limit-count=60
overlord.bedrock.limits.global-rate-limit-window-seconds=60