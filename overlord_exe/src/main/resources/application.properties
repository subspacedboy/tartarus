spring.application.name=Overlord_exe

spring.datasource.url=jdbc:mysql://localhost:3306/overlord_dev?useInformationSchema=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

server.port=8090

management.server.port=8091
management.endpoints.web.base-path=/bread
management.endpoints.enabled-by-default=false
management.endpoint.metrics.enabled=true
management.endpoint.caches.enabled=true
management.endpoint.health.enabled=true
management.endpoint.flyway.enabled=true
management.endpoint.mappings.enabled=true
management.endpoints.web.exposure.include=*

overlord.coordinator=http://localhost:5002
overlord.ws_uri=ws://localhost:5002/ws/events
overlord.mqtt_broker_uri=ws://127.0.0.1:4447/mqtt

# Development placeholder PKCS#8 P-256 Author private key used for deterministic bot key derivation
overlord.author_private_key=MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQg1hAkSkYOZyFp+B7TmuY5BIqMRbMIuw5Pb/FhcSJEi+KhRANCAASLUWif/NV39e7fTrpo/O0Cwkp00mZNTYbM0zzjqP8hoDxz485Dc3c+0ujSOmweHtwfeKLubF4eOuF0tottkqdD

