spring.application.name=Overlord_exe
spring.config.import=optional:file:./application-local.properties,optional:file:./overlord_exe/application-local.properties,optional:classpath:application-local.properties
overlord.environment=dev

spring.datasource.url=jdbc:mysql://localhost:3306/overlord_dev?useInformationSchema=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

server.port=8090

management.server.port=8091
management.endpoints.web.base-path=/bread
management.endpoints.enabled-by-default=false
management.endpoint.metrics.enabled=true
management.endpoint.caches.enabled=true
management.endpoint.health.enabled=true
management.endpoint.flyway.enabled=true
management.endpoint.mappings.enabled=true
management.endpoints.web.exposure.include=*

overlord.coordinator=https://tartarus.subjugated.club/api
overlord.ws_uri=wss://tartarus.subjugated.club/api/ws/events
#overlord.mqtt_broker_uri=ws://127.0.0.1:4447/mqtt

# Development placeholder PKCS#8 P-256 Author private key used for deterministic bot key derivation
overlord.author_private_key=MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQg1hAkSkYOZyFp+B7TmuY5BIqMRbMIuw5Pb/FhcSJEi+KhRANCAASLUWif/NV39e7fTrpo/O0Cwkp00mZNTYbM0zzjqP8hoDxz485Dc3c+0ujSOmweHtwfeKLubF4eOuF0tottkqdD

# Production examples:
#overlord.coordinator=https://tartarus.subjugated.club/api
#overlord.ws_uri=wss://tartarus.subjugated.club/api/ws/events
#overlord.mqtt_broker_uri=wss://tartarus-mqtt.subjugated.club/mqtt
# No trailing slash on base_url
overlord.base_url=http://localhost:8090

overlord.bsky.user=overlord-exe-dev-1.bsky.social
# Set overlord.bsky.password in application-local.properties (or OVERLORD_BSKY_PASSWORD env var)
overlord.bsky.password=

# Dev only thymeleaf stuff
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.thymeleaf.suffix=.html

# Google Gemini 3.5 Flash-Lite configuration
overlord.gemini.model=gemini-3.5-flash-lite
overlord.gemini.max-tokens=300
overlord.gemini.temperature=0.0
overlord.gemini.thinking-level=LOW
# Set overlord.gemini.api-key=... or provide GEMINI_API_KEY env var

# LLM rate & cost control limits
overlord.bedrock.limits.max-message-length=500
overlord.bedrock.limits.max-context-messages=10
overlord.bedrock.limits.max-conversation-turns=8
overlord.bedrock.limits.convo-rate-limit-count=5
overlord.bedrock.limits.convo-rate-limit-window-seconds=30
overlord.bedrock.limits.convo-min-interval-seconds=2
overlord.bedrock.limits.global-rate-limit-count=60
overlord.bedrock.limits.global-rate-limit-window-seconds=60