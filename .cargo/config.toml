[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
# runner = "espflash --monitor" # Select this runner for espflash v1.x.x
#runner = "espflash --monitor" # Select this runner for espflash v1.x.x
runner = "espflash flash --monitor --partition-table partitions.csv --no-skip" # Select this runner for espflash v2.x.x
rustflags = [ "--cfg",
    "espidf_time64",
] # Extending time_t for ESP IDF 5: https://github.com/esp-rs/rust/issues/110

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU="esp32s3"
# Note: this variable is not used by the pio builder (`cargo build --features pio`)
ESP_IDF_VERSION = "v5.5.4"
# Copy secure boot signing key and partitions into the ESP-IDF build directory
ESP_IDF_GLOB_COREROOT_BASE = { value = ".", relative = true }
ESP_IDF_GLOB_COREROOT_KEY = "secure_boot_signing_key.pem"
ESP_IDF_GLOB_COREROOT_PARTITIONS = "partitions.csv"



# Workaround for https://github.com/esp-rs/esp-idf-template/issues/174 until
# https://github.com/esp-rs/esp-idf-hal/pull/387 gets released and the template
# updated.
CRATE_CC_NO_DEFAULTS = "1"
#ssb: Make it speedy
ESPFLASH_BAUD = "921600"
