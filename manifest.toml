esp_toml_version = 1.0
firmware_images_url = "https://tartarus.subjugated.club/firmware2/"
supported_apps = ["TartarusLock-Update", "TartarusLock-Full"]

[TartarusLock-Update]
chipsets = ["ESP32-S3"]
description = "Tartarus Lock Firmware Update (Unsigned, preserves NVS)"
image.esp32-s3 = "app.bin"
offset = "0x10000"

[TartarusLock-Full]
chipsets = ["ESP32-S3"]
description = "Tartarus Lock Full Provisioning (Bootloader + Partitions + App)"
image.esp32-s3 = "image.bin"
offset = "0x0000"
