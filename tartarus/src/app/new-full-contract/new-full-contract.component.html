<form [formGroup]="contractForm" (submit)="createContract()">
  <div class="grid grid-cols-1 gap-6 lg:grid-cols-12">
    <!-- Left Column: Contract Settings & Output -->
    <div class="space-y-6 lg:col-span-5">
      <section hlmCard>
        <div hlmCardHeader>
          <h2 hlmCardTitle class="text-xl">Contract Builder</h2>
          <p hlmCardDescription>
            Configure unlock permissions, contract terms, and cryptographic signing options.
          </p>
        </div>

        <div hlmCardContent>
          <fieldset class="space-y-4">
            <legend class="sr-only">Contract Terms and Unlock Permissions</legend>

            <label
              for="isTempUnlockAllowed"
              class="flex cursor-pointer items-center justify-between gap-3 rounded-lg border border-border bg-muted/30 p-3 text-sm font-medium text-foreground"
            >
              <span>Is temporary unlocking allowed?</span>
              <input
                id="isTempUnlockAllowed"
                type="checkbox"
                formControlName="isTempUnlockAllowed"
                class="h-4 w-4 rounded border-input text-primary focus:ring-ring"
              />
            </label>

            <label
              for="isEmergencyUnlockAllowed"
              class="flex cursor-pointer items-center justify-between gap-3 rounded-lg border border-border bg-muted/30 p-3 text-sm font-medium text-foreground"
            >
              <span>Is emergency unlock allowed?</span>
              <input
                id="isEmergencyUnlockAllowed"
                type="checkbox"
                formControlName="isEmergencyUnlockAllowed"
                class="h-4 w-4 rounded border-input text-primary focus:ring-ring"
              />
            </label>

            <div class="space-y-1.5">
              <label hlmLabel for="terms">Terms</label>
              <textarea
                id="terms"
                hlmInput
                formControlName="terms"
                placeholder="Part of the contract body. Will be digitally signed."
                rows="4"
              ></textarea>
            </div>

            <div class="space-y-1.5">
              <label hlmLabel for="notes">Notes</label>
              <textarea
                id="notes"
                hlmInput
                formControlName="notes"
                placeholder="Only shown on website"
                rows="3"
              ></textarea>
            </div>

            <button hlmBtn variant="default" size="lg" class="w-full" type="submit">
              Save Contract
            </button>
          </fieldset>
        </div>
      </section>

      <!-- Generated Contract Canvas -->
      <section hlmCard #hiddenDiv hidden>
        <div hlmCardHeader>
          <h3 hlmCardTitle class="text-base">Contract QR Code</h3>
        </div>
        <div hlmCardContent class="flex justify-center">
          <div class="qr-quiet-zone">
            <canvas #canvas></canvas>
          </div>
        </div>
      </section>
    </div>

    <!-- Right Column: Bot Selection -->
    <div class="lg:col-span-7">
      <app-bot-selector
        [bots]="bots"
        [selectedBotNames]="selectedBotNames"
        (botAdded)="addBot($event)"
        (botRemoved)="removeBotByName($event)"
      ></app-bot-selector>
    </div>
  </div>
</form>
