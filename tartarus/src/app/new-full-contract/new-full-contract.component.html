<form [formGroup]="contractForm" (submit)="createContract()">
  <div class="row">
    <!-- Left Column: Contract Settings & Output -->
    <div class="col-lg-5 col-md-12 mb-3">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h3 class="h5 mb-0">Contract Builder</h3>
        </div>
        <div class="card-body">
          <fieldset>
            <div class="form-check form-switch mb-3">
              <input
                id="isTempUnlockAllowed"
                class="form-check-input"
                type="checkbox"
                formControlName="isTempUnlockAllowed"
              />
              <label class="form-check-label" for="isTempUnlockAllowed">
                Is temporary unlocking allowed?
              </label>
            </div>

            <div class="form-check form-switch mb-3">
              <input
                id="isEmergencyUnlockAllowed"
                class="form-check-input"
                type="checkbox"
                formControlName="isEmergencyUnlockAllowed"
              />
              <label class="form-check-label" for="isEmergencyUnlockAllowed">
                Is emergency unlock allowed?
              </label>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold" for="terms">Terms</label>
              <textarea
                id="terms"
                class="form-control"
                formControlName="terms"
                placeholder="Part of the contract body. Will be digitally signed."
                rows="4">
              </textarea>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold" for="notes">Notes</label>
              <textarea
                id="notes"
                class="form-control"
                formControlName="notes"
                placeholder="Only shown on website"
                rows="3">
              </textarea>
            </div>

            <button class="btn btn-lg btn-primary w-100" type="submit">
              Save Contract
            </button>
          </fieldset>
        </div>
      </div>

      <!-- Generated Contract Canvas -->
      <div class="card shadow-sm mt-3" #hiddenDiv hidden>
        <div class="card-header bg-dark text-white">
          <h4 class="h6 mb-0">Contract QR Code</h4>
        </div>
        <div class="card-body text-center">
          <canvas #canvas></canvas>
        </div>
      </div>
    </div>

    <!-- Right Column: Bot Selection -->
    <div class="col-lg-7 col-md-12 mb-3">
      <app-bot-selector
        [bots]="bots"
        [selectedBotNames]="selectedBotNames"
        (botAdded)="addBot($event)"
        (botRemoved)="removeBotByName($event)">
      </app-bot-selector>
    </div>
  </div>
</form>
