<div class="mx-auto max-w-xl space-y-6 py-4">
  <section hlmCard>
    <div hlmCardHeader>
      <h1 hlmCardTitle class="text-2xl">Wi-Fi QR Helper</h1>
      <p hlmCardDescription>
        Generate a standard WPA Wi-Fi QR code to bootstrap your Tartarus lock. All encoding runs locally in your browser.
      </p>
    </div>

    <div hlmCardContent>
      <form [formGroup]="wifiForm" (submit)="generate()" class="space-y-4">
        <fieldset class="space-y-4">
          <legend class="sr-only">Wi-Fi Credentials</legend>

          <div class="space-y-1.5">
            <label hlmLabel for="ssid">SSID</label>
            <input
              id="ssid"
              hlmInput
              type="text"
              formControlName="ssid"
              placeholder="SSID / Access point name"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
            />
          </div>

          <div class="space-y-1.5">
            <label hlmLabel for="password">Password</label>
            <input
              id="password"
              hlmInput
              type="password"
              formControlName="password"
              placeholder="Wi-Fi Password"
            />
          </div>

          <button hlmBtn variant="default" class="w-full" type="submit">
            Regenerate
          </button>
        </fieldset>
      </form>
    </div>
  </section>

  <section hlmCard #hiddenDiv hidden>
    <div hlmCardHeader>
      <h2 hlmCardTitle class="text-lg">Configuration Data</h2>
    </div>
    <div hlmCardContent class="flex justify-center">
      <div class="qr-quiet-zone">
        <canvas #canvas></canvas>
      </div>
    </div>
  </section>
</div>
