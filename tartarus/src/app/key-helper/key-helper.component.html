<div class="mx-auto max-w-xl py-4">
  <section hlmCard>
    <div hlmCardHeader>
      <h1 hlmCardTitle class="text-2xl">Key Inspector</h1>
      <p hlmCardDescription>
        Inspect a Tartarus key QR image and extract its compressed Base64 public key and PEM representation.
      </p>
    </div>

    <div hlmCardContent class="space-y-4">
      <div class="space-y-1.5">
        <label hlmLabel for="keyHelperFileInput">Key QR Code Image</label>
        <input
          id="keyHelperFileInput"
          hlmInput
          type="file"
          (change)="onFileSelected($event)"
          accept="image/*"
        />
        <canvas #scanCanvas class="hidden"></canvas>
      </div>

      <div class="space-y-3 rounded-lg border border-border bg-muted/30 p-3.5 text-sm">
        <div>
          <span class="text-xs font-semibold uppercase tracking-wider text-muted-foreground block">
            Scanned QR Code Data:
          </span>
          <strong class="font-mono text-foreground">{{ scannedResult || 'Waiting for image...' }}</strong>
        </div>

        <div>
          <span class="text-xs font-semibold uppercase tracking-wider text-muted-foreground block">
            Compressed Key (Base64):
          </span>
          <code class="mt-1 block break-all rounded border border-border bg-muted px-2 py-1 font-mono text-xs text-foreground select-all">
            {{ compressedKeyInBase64 || '—' }}
          </code>
        </div>

        <div>
          <span class="text-xs font-semibold uppercase tracking-wider text-muted-foreground block">
            Public PEM:
          </span>
          <pre class="mt-1 overflow-x-auto whitespace-pre-wrap break-all rounded border border-border bg-muted px-2 py-1.5 font-mono text-xs text-foreground select-all">{{ publicPem || '—' }}</pre>
        </div>
      </div>
    </div>
  </section>
</div>
