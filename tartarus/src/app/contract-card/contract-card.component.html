@if (contract) {
  <section hlmCard [class]="'flex h-full flex-col justify-between transition-shadow hover:shadow-md ' + accentBorderClass">
    <div hlmCardHeader class="pb-3">
      <div class="flex items-start justify-between gap-2">
        <h3 hlmCardTitle class="font-mono text-sm font-semibold text-foreground break-all">
          {{ contract.name }}
        </h3>
        <span hlmBadge [variant]="badgeVariant" class="shrink-0">
          {{ stateLabel }}
        </span>
      </div>
    </div>

    <div hlmCardContent class="space-y-2 pb-3 text-sm text-muted-foreground">
      @if (contract.notes) {
        <p class="line-clamp-2 text-foreground/90">{{ contract.notes }}</p>
      }
      @if (contract.state === 'RELEASED' && contract.updatedAt) {
        <p class="text-xs text-muted-foreground">
          Ended at {{ contract.updatedAt | date : 'short' }}
        </p>
      }
    </div>

    <div hlmCardFooter class="justify-end border-t border-border/60 pt-3">
      <a
        routerLink="{{ basePath }}contract/{{ contract.name }}"
        hlmBtn
        variant="outline"
        size="sm"
        class="w-full sm:w-auto"
      >
        Details
      </a>
    </div>
  </section>
}
