@if (knownToken) {
  <section hlmCard class="flex h-full flex-col justify-between border-l-4 border-l-primary transition-shadow hover:shadow-md">
    <div hlmCardHeader class="pb-3">
      <div class="flex items-start justify-between gap-2">
        <h3
          hlmCardTitle
          class="truncate text-base font-semibold text-foreground"
          [title]="knownToken.notes || knownToken.name"
        >
          {{ knownToken.notes || knownToken.name }}
        </h3>
        <span hlmBadge variant="secondary" class="shrink-0">Lock Session</span>
      </div>
    </div>

    <div hlmCardContent class="space-y-2 pb-3 text-sm">
      <div class="flex items-center gap-2">
        <span class="text-xs font-medium uppercase tracking-wider text-muted-foreground">Token:</span>
        <code class="select-all rounded border border-border bg-muted px-2 py-0.5 font-mono text-xs text-foreground">
          {{ knownToken.shareableToken }}
        </code>
      </div>
      @if (knownToken.createdAt) {
        <p class="text-xs text-muted-foreground">
          Added {{ knownToken.createdAt | date: 'short' }}
        </p>
      }
    </div>

    <div hlmCardFooter class="justify-between gap-2 border-t border-border/60 pt-3">
      <a [routerLink]="['/lock-sessions', knownToken.shareableToken]" hlmBtn variant="default" size="sm">
        Details
      </a>
      <button type="button" hlmBtn variant="destructive" size="sm" (click)="onDelete($event)">
        Delete
      </button>
    </div>
  </section>
}
