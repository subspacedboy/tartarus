name: Continuous Integration

on:
  push:
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: build
            args: --release
#          - command: fmt
#            args: --all -- --check --color always
#          - command: clippy
#            args: --all-targets --all-features --workspace -- -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Ensure signing key placeholder exists
        run: |
          if [ ! -f secure_boot_signing_key.pem ]; then
            openssl genrsa -out secure_boot_signing_key.pem 3072
          fi
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}

  coordinator-tests:
    name: Tartarus Coordinator Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tartarus-coordinator
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run unit tests
        run: ./gradlew test compileIntegrationTestKotlin

  overlord-tests:
    name: Overlord Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overlord_exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run unit tests
        run: ./gradlew test compileIntegrationTestKotlin

  frontend-tests:
    name: Tartarus Web Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tartarus
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tartarus/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run unit tests
        run: npx ng test --watch=false
